<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Chat</title>
<style>
  :root {
    --bg-a: #e9eef6;  --bg-b: #f8fafc;
    --surface: #ffffff;
    --line: #e2e8f0;
    --text: #14202f;
    --muted: #64748b;
    --brand-1: #14b8a6; --brand-2: #6366f1;
    --mine-grad: linear-gradient(135deg, #14b8a6, #0ea5b7);
    --mine-txt: #ffffff;
    --theirs: #ffffff;
    --theirs-txt: #14202f;
    --pill-bg: #ecfdf5;
    --shadow: 0 8px 28px rgba(15, 32, 60, .10);
    --input-bg: #f1f5f9;
    --send-bg: linear-gradient(135deg, #14b8a6, #0f9488);
    --send-txt: #ffffff;
  }
  [data-theme="dark"] {
    --bg-a: #0f1520;  --bg-b: #141c2b;
    --surface: #1a2436;
    --line: #263246;
    --text: #e8eef7;
    --muted: #8ba0bd;
    --brand-1: #2dd4bf; --brand-2: #818cf8;
    --mine-grad: linear-gradient(135deg, #0d9488, #4338ca);
    --mine-txt: #ffffff;
    --theirs: #222e44;
    --theirs-txt: #e8eef7;
    --pill-bg: #172635;
    --shadow: 0 8px 28px rgba(0, 0, 0, .35);
    --input-bg: #222e44;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg-a), var(--bg-b));
    color: var(--text); display: flex; align-items: center; justify-content: center;
    padding: 18px; transition: background .3s ease, color .3s ease;
  }
  .app {
    width: min(760px, 100%); height: min(820px, calc(100vh - 36px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
    transition: background .3s ease, border-color .3s ease;
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .logo {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    display: grid; place-items: center; color: #fff; font-size: 21px; font-weight: 800;
    box-shadow: 0 4px 12px rgba(20, 184, 166, .45);
  }
  .title h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .title p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; background: var(--pill-bg); color: var(--muted);
    white-space: nowrap;
  }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; }
  .pill.on { color: #047857; }
  .pill.on .dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 16px; cursor: pointer;
    display: grid; place-items: center; transition: .15s ease;
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(15,32,60,.12); }
  .icon-btn.off { opacity: .45; }

  /* ---------- setup row ---------- */
  .setup { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .setup label { font-size: 12px; color: var(--muted); font-weight: 600; }
  select, input[type="text"], input[type="number"] {
    background: var(--input-bg); color: var(--text); border: none; border-radius: 9px;
    padding: 8px 11px; font-size: 13px; outline: none; font-family: inherit;
  }
  input:focus, select:focus { box-shadow: 0 0 0 2px var(--brand-1); }
  .setup input#name { flex: 1; min-width: 100px; }
  .setup input#port { width: 96px; }
  .btn-connect {
    background: var(--send-bg); color: var(--send-txt); border: none; border-radius: 9px;
    padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: .15s ease;
  }
  .btn-connect:disabled, .btn-connect.on { background: #475569; color: #e2e8f0; }
  .btn-connect:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,118,110,.4); }

  /* ---------- messages ---------- */
  #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 10px; margin: 0 0 14px; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none; margin-top: 2px;
    display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; user-select: none;
  }
  .body { max-width: min(72%, 540px); }
  .who { font-size: 12px; color: var(--muted); margin: 0 0 3px; font-weight: 600; }
  .bubble {
    display: inline-block; padding: 9px 13px; border-radius: 16px; line-height: 1.45;
    font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
    border-bottom-left-radius: 5px; background: var(--theirs); color: var(--theirs-txt);
    border: 1px solid var(--line); transition: background .3s, color .3s;
  }
  .bubble .time { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; text-align: right; opacity: .8; }
  .bubble .tag { font-size: 10px; font-style: italic; opacity: .75; margin-left: 6px; }
  .bubble.del { opacity: .55; font-style: italic; }
  .msg.mine { flex-direction: row-reverse; }
  .msg.mine .body { text-align: right; }
  .msg.mine .who { color: var(--brand-1); }
  .msg.mine .bubble { background: var(--mine-grad); color: var(--mine-txt); border: none; border-bottom-left-radius: 16px; border-bottom-right-radius: 5px; }
  .msg.mine .bubble .time { color: rgba(255,255,255,.75); }
  .msg.mine .bubble .tag { color: rgba(255,255,255,.8); }

  /* own-message actions (hover) */
  .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 5px; opacity: 0; transition: opacity .15s; }
  .msg.mine:hover .actions, .msg.mine.editing .actions { opacity: 1; }
  .act {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 8px; font-size: 13px; width: 28px; height: 28px; cursor: pointer; line-height: 1;
    display: grid; place-items: center; transition: .12s ease;
  }
  .act:hover { color: #7c3aed; border-color: #7c3aed; transform: translateY(-1px); }

  /* inline editor */
  .editor { background: var(--input-bg); border-radius: 14px; padding: 8px; border: 1px solid var(--line); }
  .editor textarea {
    width: 100%; min-height: 60px; resize: vertical; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .editor textarea:focus { box-shadow: 0 0 0 2px var(--brand-1); border-color: transparent; }
  .edbar { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .edbar button {
    border: none; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .edbar .ok { background: var(--send-bg); color: var(--send-txt); }
  .edbar .cancel { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }

  .sys { display: flex; justify-content: center; margin: 10px 0; }
  .sys span {
    font-size: 11.5px; color: var(--muted); background: var(--input-bg); padding: 4px 12px;
    border-radius: 999px; transition: background .3s;
  }
  .msg.other .who { color: #7c3aed; }

  @media (max-width: 620px) { .body { max-width: 78%; } }

  /* ---------- composer ---------- */
  .composer { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  .emoji { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .emoji button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer;
    font-size: 16px; padding: 4px 7px; transition: .12s ease;
  }
  .emoji button:hover { transform: translateY(-2px) scale(1.1); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input {
    flex: 1; background: var(--input-bg); border-radius: 12px; padding: 12px 14px; font-size: 14.5px;
    border: none; color: var(--text); outline: none; font-family: inherit;
  }
  .row input:focus { box-shadow: 0 0 0 2px var(--brand-1); }
  .btn-send {
    width: 46px; height: 46px; border: none; border-radius: 13px; cursor: pointer; flex: none;
    background: var(--send-bg); color: var(--send-txt); font-size: 19px; font-weight: 800;
    display: grid; place-items: center; transition: .15s ease; font-family: inherit;
  }
  .btn-send:disabled { background: #cbd5e1; color: #94a3b8; cursor: default; }
  .btn-send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(15,118,110,.4); }
  .chars { font-size: 11px; color: var(--muted); text-align: right; margin-top: 5px; height: 14px; }
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="logo">ESP</div>
      <div class="title">
        <h1>ESP32 Mesh Chat</h1>
        <p>wireless group chat &middot; edit &amp; delete propagate over the radio</p>
      </div>
      <div class="right">
        <span class="pill" id="pill"><span class="dot"></span><span id="pillText">connecting</span></span>
        <button class="icon-btn off" id="btnSound" title="toggle sound">&#128266;</button>
        <button class="icon-btn" id="btnTheme" title="toggle theme">&#9728;&#65039;</button>
      </div>
    </div>

    <div class="setup">
      <label for="name">Name</label>
      <input type="text" id="name" maxlength="20" placeholder="your display name">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="sim">Simulator</option>
        <option value="serial">Serial ESP32</option>
      </select>
      <label for="port">Port</label>
      <input type="text" id="port" placeholder="5555 / COM3">
      <button class="btn-connect" id="btnConnect">Connect</button>
    </div>

    <div id="log">
      <div class="sys"><span>welcome to the mesh &mdash; hover your own message to edit or delete it</span></div>
    </div>

    <div class="composer">
      <div class="emoji" id="emojiRow"></div>
      <div class="row">
        <input type="text" id="text" maxlength="220" placeholder="Type a message &hellip;" autocomplete="off">
        <button class="btn-send" id="btnSend" disabled title="Send">&#10148;</button>
      </div>
      <div class="chars" id="chars"></div>
    </div>
  </div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const EMOJIS = ["\u{1F44D}","\u{1F602}","\u{2764}\uFE0F","\u{1F44F}","\u{1F525}","\u{1F389}","\u{1F600}","\u{1F64F}","\u{1F9E1}","\u{1F440}"];

const state = {
  name: localStorage.getItem("esp32chat_name") || "",
  connected: false,
  mode: "sim",
  port: "5555",
  sound: localStorage.getItem("esp32chat_sound") !== "0",
};

const norm = s => String(s || "").replace(/[|\r\n]/g, " ").replace(/\s+/g, " ").trim();

// --- helpers ---------------------------------------------------------------
function hashHue(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatarStyle(name) { const h = hashHue(name); return `background: linear-gradient(135deg, hsl(${h},65%,52%), hsl(${(h+40)%360},70%,44%))`; }
function initialOf(name) { return (name[0] || "?").toUpperCase(); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
const KEY = (user, mid) => user + ":" + mid;

const seen = new Set();           // message keys already in the DOM
let soundCtx = null;
function beep() {
  if (!state.sound) return;
  try {
    soundCtx = soundCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (soundCtx.state === "suspended") soundCtx.resume();
    const o = soundCtx.createOscillator(), g = soundCtx.createGain();
    o.type = "sine"; o.frequency.value = 740;
    o.connect(g); g.connect(soundCtx.destination);
    g.gain.setValueAtTime(0.0001, soundCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, soundCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, soundCtx.currentTime + 0.18);
    o.start(); o.stop(soundCtx.currentTime + 0.2);
  } catch (_) {}
}

// --- rendering -------------------------------------------------------------
function makeBubble(who, mid, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.dataset.who = who;
  wrap.dataset.mid = mid;
  wrap.dataset.key = KEY(who, mid);
  wrap.dataset.text = text;

  const av = document.createElement("div");
  av.className = "avatar";
  av.style.cssText = avatarStyle(who);
  av.textContent = initialOf(who);

  const body = document.createElement("div");
  body.className = "body";
  const whoEl = document.createElement("div");
  whoEl.className = "who";
  whoEl.textContent = who;
  body.appendChild(whoEl);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bundleBubble(bubble, text, false);

  body.appendChild(bubble);
  wrap.appendChild(av);
  wrap.appendChild(body);
  return wrap;
}

function bundleBubble(bubble, text, deleted) {
  bubble.innerHTML = "";
  if (deleted) {
    bubble.classList.add("del");
    bubble.textContent = "This message was deleted.";
  } else {
    bubble.classList.remove("del");
    const span = document.createElement("span");
    span.innerHTML = esc(text);
    bubble.appendChild(span);
    if (bubble.dataset.edited === "1") {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "edited";
      bubble.appendChild(tag);
    }
  }
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  bubble.appendChild(time);
}

function addActions(wrap, mine) {
  if (!mine) return;
  const body = wrap.querySelector(".body");
  const bar = document.createElement("div");
  bar.className = "actions";
  const editBtn = document.createElement("button");
  editBtn.className = "act"; editBtn.title = "Edit"; editBtn.innerHTML = "&#9998;";
  editBtn.addEventListener("click", () => enterEditor(wrap));
  const delBtn = document.createElement("button");
  delBtn.className = "act"; delBtn.title = "Delete"; delBtn.innerHTML = "&#128465;";
  delBtn.addEventListener("click", () => deleteMessage(wrap));
  bar.appendChild(editBtn);
  bar.appendChild(delBtn);
  body.appendChild(bar);
}

function addMessage(user, text, mine, mid) {
  const key = KEY(user, mid);
  if (seen.has(key)) return;
  seen.add(key);
  const wrap = makeBubble(user, mid, text);
  wrap.classList.add(mine ? "mine" : "other");
  wrap.querySelector(".who").textContent = user + (mine ? " (you)" : "");
  addActions(wrap, mine);
  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  if (!mine) beep();
}

function addSys(text) {
  const div = document.createElement("div");
  div.className = "sys";
  const s = document.createElement("span");
  s.textContent = text;
  div.appendChild(s);
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

// --- editing ---------------------------------------------------------------
function enterEditor(wrap) {
  if (wrap.dataset.deleted) return;
  if (wrap.querySelector(".editor")) return;
  const bubble = wrap.querySelector(".bubble");
  const editor = document.createElement("div");
  editor.className = "editor";
  const ta = document.createElement("textarea");
  ta.maxLength = 220;
  ta.value = wrap.dataset.text || "";
  const bar = document.createElement("div");
  bar.className = "edbar";
  const ok = document.createElement("button");
  ok.className = "ok"; ok.textContent = "Save";
  const cancel = document.createElement("button");
  cancel.className = "cancel"; cancel.textContent = "Cancel";
  bar.appendChild(cancel);
  bar.appendChild(ok);
  editor.appendChild(ta);
  editor.appendChild(bar);
  wrap.querySelector(".body").appendChild(editor);
  bubble.style.display = "none";
  wrap.classList.add("editing");
  ta.focus();
  cancel.addEventListener("click", () => { editor.remove(); bubble.style.display = ""; wrap.classList.remove("editing"); });
  ok.addEventListener("click", () => saveEdit(wrap, ta.value));
}

async function saveEdit(wrap, rawText) {
  const text = norm(rawText);
  if (!text) return;
  const r = await (await fetch("/api/edit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: wrap.dataset.who, msgid: wrap.dataset.mid, text }),
  })).json();
  if (r.ok) applyEditText(wrap, text);
  else addSys("edit error: " + r.error);
  closeEditor(wrap);
}

function closeEditor(wrap) {
  const editor = wrap.querySelector(".editor");
  if (editor) editor.remove();
  const bubble = wrap.querySelector(".bubble");
  if (bubble) bubble.style.display = "";
  wrap.classList.remove("editing");
}

function applyEditText(wrap, text) {
  wrap.dataset.text = text;
  const bubble = wrap.querySelector(".bubble");
  bubble.dataset.edited = "1";
  bundleBubble(bubble, text, !!wrap.dataset.deleted);
}

async function deleteMessage(wrap) {
  const r = await (await fetch("/api/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: wrap.dataset.who, msgid: wrap.dataset.mid }),
  })).json();
  if (r.ok) applyDeleteText(wrap);
  else addSys("delete error: " + r.error);
  closeEditor(wrap);
}

function applyDeleteText(wrap) {
  if (wrap.dataset.deleted) return;
  wrap.dataset.deleted = "1";
  wrap.classList.remove("editing");
  const bubble = wrap.querySelector(".bubble");
  bundleBubble(bubble, "", true);
  const editor = wrap.querySelector(".editor");
  if (editor) editor.remove();
}

// --- mesh events ------------------------------------------------------------
function applyEdit(ev) {
  const wrap = document.querySelector('.msg[data-key="' + KEY(ev.user, ev.msgid) + '"]');
  if (!wrap || wrap.dataset.deleted) return;
  if (wrap.dataset.applied === "e:" + ev.text) return;
  wrap.dataset.applied = "e:" + ev.text;
  applyEditText(wrap, ev.text);
  closeEditor(wrap);
}

function applyDel(ev) {
  const wrap = document.querySelector('.msg[data-key="' + KEY(ev.user, ev.msgid) + '"]');
  if (!wrap) return;
  if (wrap.dataset.applied === "d") return;
  wrap.dataset.applied = "d";
  applyDeleteText(wrap);
}

function handlePollEvents(events) {
  for (const ev of events || []) {
    if (ev.kind === "message") addMessage(ev.user, ev.text, ev.user === state.name, ev.msgid);
    else if (ev.kind === "edit") applyEdit(ev);
    else if (ev.kind === "del") applyDel(ev);
    else if (ev.kind === "status") addSys(ev.text);
  }
}

// --- connect / send ---------------------------------------------------------
function setConnected(on) {
  state.connected = on;
  $("pill").classList.toggle("on", on);
  $("pillText").textContent = on ? "Connected" : "Offline";
  $("btnConnect").textContent = on ? "Disconnect" : "Connect";
  $("btnConnect").classList.toggle("on", on);
  update();
}

function update() {
  const on = state.connected && !!norm($("text").value);
  $("btnSend").disabled = !on;
  const len = norm($("text").value).length;
  $("chars").textContent = len ? len + " / 220" : "";
}

function send() {
  const text = norm($("text").value);
  if (!text || !state.connected) return;
  state.name = norm($("name").value) || state.name || "anon";
  localStorage.setItem("esp32chat_name", state.name);
  $("text").value = "";
  update();
  fetch("/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: state.name, text }),
  })
    .then(r => r.json())
    .then(r => {
      if (r.ok) addMessage(state.name, text, true, r.msgid);
      else if (r.error === "not connected") setConnected(false);
      else addSys("send error: " + r.error);
    })
    .catch(() => addSys("could not reach the server"));
}

// --- polling -----------------------------------------------------------------
let busy = false;
async function poll() {
  if (busy || !state.connected) return;
  busy = true;
  try {
    const r = await fetch("/api/poll?after=" + state.lastId, { cache: "no-store" });
    const d = await r.json();
    state.lastId = d.now || state.lastId;
    handlePollEvents(d.events);
  } catch (_) {}
  busy = false;
}

// --- setup -------------------------------------------------------------------
$("name").value = state.name;

$("btnConnect").addEventListener("click", async () => {
  state.name = norm($("name").value) || "anon";
  localStorage.setItem("esp32chat_name", state.name);
  state.mode = $("mode").value;
  state.port = norm($("port").value) || (state.mode === "sim" ? "5555" : "COM3");

  if (state.connected) {
    await fetch("/api/disconnect", { method: "POST" });
    setConnected(false);
  } else {
    $("pillText").textContent = "connecting";
    $("pill").classList.remove("on");
    try {
      const r = await (await fetch("/api/connect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: state.mode, port: state.port }),
      })).json();
      if (r.ok) setConnected(true);
      else addSys("connection failed");
    } catch (_) { addSys("connection failed"); }
  }
});

$("text").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("text").addEventListener("input", update);
$("btnSend").addEventListener("click", send);

for (const e of EMOJIS) {
  const b = document.createElement("button");
  b.textContent = e;
  b.addEventListener("click", () => { $("text").value += e; $("text").focus(); update(); });
  $("emojiRow").appendChild(b);
}

function setSoundIcon() { $("btnSound").classList.toggle("off", !state.sound); }
$("btnSound").addEventListener("click", () => { state.sound = !state.sound; localStorage.setItem("esp32chat_sound", state.sound ? "1" : "0"); setSoundIcon(); });
setSoundIcon();

$("btnTheme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  localStorage.setItem("esp32chat_theme", cur === "dark" ? "light" : "dark");
});
if (localStorage.getItem("esp32chat_theme")) document.documentElement.setAttribute("data-theme", localStorage.getItem("esp32chat_theme"));

fetch("/api/state")
  .then(r => r.json())
  .then(s => {
    setConnected(!!s.connected);
    if (s.mode) { $("mode").value = s.mode; $("port").value = s.port; }
    setInterval(poll, 1100);
  })
  .catch(() => setInterval(poll, 1100));
</script>
</body>
</html>
